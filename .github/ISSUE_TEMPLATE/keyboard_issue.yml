# Engineered by uncoalesced
name: Keyboard problem
description: Typing, autocorrect, glide, layouts, themes, or anything the keyboard itself does
labels: ["keyboard"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste anything you would not post publicly. Keyboard
        screenshots tend to contain whatever you were typing.

        If the problem could expose typed input to another app or off the device,
        report it privately instead: Security, then "Report a vulnerability".

  - type: input
    id: version
    attributes:
      label: Version
      description: The exact string from the app's Settings tab, at the top.
      placeholder: v0.1.5-BETA
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Phone and Android version
      description: Include the ROM if it is not the manufacturer's, since that changes IME behaviour.
      placeholder: Pixel 7, Android 15. Or Redmi Note 11, LineageOS 22.2.
    validations:
      required: true

  - type: input
    id: host_app
    attributes:
      label: Which app were you typing into?
      description: >
        This is the single most useful field here, and it is not filler. A text
        field declares what kind of input it wants, and the keyboard behaves
        differently based on that. The same symptom in a browser and in a chat app
        usually has two different causes.
      placeholder: WhatsApp message box. Or Firefox address bar. Or Signal.
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what you expected instead
      description: If it involves specific characters, write them out exactly.
      placeholder: |
        I typed "teh" then space. It stayed "teh". I expected "the".
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Shortest sequence that shows it. If it only happens sometimes, say roughly how often.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the keyboard
      multiple: true
      options:
        - Typing, autocorrect, or suggestions
        - Glide typing
        - Long-press, corner symbols, or alternates
        - Shift or caps lock
        - Number row or symbol pages
        - Layout or key remapping
        - Themes and appearance
        - Keyboard size or position
        - Emoji or sticker picker
        - Clipboard history
        - Text editing panel or cursor
        - Media controls
        - Haptics
        - Privacy behaviour in password fields
        - Something else
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: >
        Optional, but often decisive. Glide typing on or off, number row, symbols
        on keys, the size sliders, and whether the privacy switch in the keyboard
        toolbar is on.
      placeholder: Glide on, number row on, symbols on keys off, height 100%.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the newest release, or I have said which older one this is.
          required: true
        - label: I have not included any password, code, or private message text.
          required: true
