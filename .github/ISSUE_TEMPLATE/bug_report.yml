# Engineered by uncoalesced
name: Bug report
description: Stickers, import, GIF conversion, device transfer, settings, or a crash
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For anything the keyboard itself does while typing, the keyboard template
        asks better questions. For anything that could expose typed input, report
        it privately: Security, then "Report a vulnerability".

  - type: input
    id: version
    attributes:
      label: Version
      description: The exact string from the app's Settings tab.
      placeholder: v0.1.5-BETA
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 7, Android 15
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - Sticker creation, crop, or eraser
        - Importing a screenshot or photo
        - Video trim or GIF/WebP conversion
        - Sticker library, categories, or favourites
        - Sending a sticker to another app
        - Device-to-device transfer or pairing
        - Settings screens
        - Theme or layout editor
        - It crashes
        - Something else
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Screenshots help. If it crashed and you can get a log, paste it, but check
        it for anything private first. If a sticker failed to send to a specific
        app, naming that app matters, because several of them check the file's MIME
        type before accepting it and behave differently.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the newest release, or I have said which older one this is.
          required: true
        - label: I searched existing issues.
          required: true
