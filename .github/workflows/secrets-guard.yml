# Engineered by uncoalesced
#
# Refuses to let a signing key or a credential into the repository.
#
# This matters more here than the generic case. `app/build.gradle.kts` reads
# `keystore.properties` from the repo root and that file points at a keystore stored
# outside the repo; both are gitignored. Losing the key permanently breaks in-place
# updates for everyone on a release build, and publishing it is worse -- anyone could
# then sign an APK that Android would install over the top of the real one.
#
# Written as plain shell rather than a scanning action on purpose. Adding a
# third-party action to a repository whose own rules require vetting every dependency
# would be an odd way to improve its supply chain, and the specific things worth
# refusing here are known by name.

name: Secrets Guard

on:
  push:
    branches: [ main, development, deployment ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: No signing material committed
        run: |
          set -uo pipefail
          fail=0

          # 1. Files that must never be tracked, by name.
          tracked=$(git ls-files | grep -E '(^|/)(keystore\.properties|.*\.jks|.*\.keystore|.*\.p12|.*\.pfx|google-services\.json)$' || true)
          if [ -n "$tracked" ]; then
            echo "SIGNING GUARD: these files are tracked and must not be:"
            echo "$tracked"
            fail=1
          fi

          # 2. .gitignore must still cover them. The rule above only catches a file
          #    that is already in, which is one commit too late; this catches the
          #    edit that would let the next one through.
          for pattern in "keystore.properties" "*.jks" "*.keystore"; do
            if ! grep -qF -- "$pattern" .gitignore; then
              echo "SIGNING GUARD: .gitignore no longer covers '$pattern'."
              fail=1
            fi
          done

          # 3. Key material and credentials by content, across tracked text files.
          #    -I skips binaries, so the dictionary and the icons are not scanned.
          if git grep -I -n -E -- '-----BEGIN( [A-Z]+)? PRIVATE KEY-----' -- . ; then
            echo "SIGNING GUARD: a private key is committed."
            fail=1
          fi

          # Provider token shapes. These are recognisable prefixes, so a hit is a hit
          # rather than a guess.
          if git grep -I -n -E -- '(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|xox[abprs]-[A-Za-z0-9-]{10,}' -- . ; then
            echo "SIGNING GUARD: what looks like an access token is committed."
            fail=1
          fi

          # A signing credential assigned to a literal. Deliberately not matching the
          # words alone: app/build.gradle.kts assigns `storePassword` *from* a
          # property read, which is the correct shape and must keep passing.
          # Only double quotes are matched, which is what .kts and .gradle use --
          # a bare `storePassword=...` belongs to keystore.properties, and that file
          # is caught by name in check 1 above.
          if git grep -I -n -E -- '(storePassword|keyPassword|storeFile)[[:space:]]*=[[:space:]]*"[^"]+"' -- '*.kts' '*.gradle' ; then
            echo "SIGNING GUARD: a signing credential looks hardcoded."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Nothing here is auto-removable: a secret that reached a commit is"
            echo "already public on a public repo and must be rotated, not just deleted."
            exit 1
          fi
          echo "Secrets guard passed."
